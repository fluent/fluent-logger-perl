name: test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - "5.16"
          - "5.24"
          - "5.30"
          - "5.38"
          - "5.40"
          - "5.42"
          - "5.44"
    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@eebc5c886de14ebbfcd2493d49a12007d2c30477 # v1.44.5
        with:
          perl-version: ${{ matrix.perl }}
      - name: Setup ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0"
      - name: prepare
        run: |
          cpanm -nf Proc::Guard Number::Format
          gem install fluentd --no-document -v '~> 1.0'
      - name: test
        run: |
          cpanm --installdeps .
          perl Build.PL
          ./Build
          ./Build test
